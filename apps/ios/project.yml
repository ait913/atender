name: Atender

options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: net.appily
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator

targets:
  Atender:
    type: application
    platform: iOS
    sources:
      - Atender
    info:
      path: Atender/Info.plist
      properties:
        ATENDER_API_BASE_URL: $(ATENDER_API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: net.appily.atender.auth
            CFBundleURLSchemes:
              - atender
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Atender/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.appily.atender
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AtenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AtenderTests
    dependencies:
      - target: Atender
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1

schemes:
  Atender:
    build:
      targets:
        Atender: all
    run:
      config: Debug
      executable: Atender
    test:
      config: Debug
      targets:
        - AtenderTests
