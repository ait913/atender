<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Atender SNS 画像 (1920×1080)</title>
<link rel="stylesheet" href="../../apps/lp/site/fonts/zenmaru.css">
<style>
:root {
  --bg: #FFFFFF;
  --glow: color-mix(in srgb, #1E96E6 18%, #FFFFFF);
  --glow-mid: color-mix(in srgb, #1E96E6 6%, #FFFFFF);
  --ink: #30415B;
  --accent-600: #147FCC;
  --phone-shadow: rgba(15, 23, 42, .28);
  --shape-alpha-k: 2;
  --hl: #56D8C3;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FFFFFF; }
body { color: var(--ink); font-family: var(--font); font-weight: 500; -webkit-font-smoothing: antialiased; }
.canvas { width: 1920px; height: 1080px; position: relative; overflow: hidden; isolation: isolate;
  background: radial-gradient(ellipse at 72% 82%, var(--glow) 0, var(--glow-mid) 35%, var(--bg) 67%); }
.wordmark { position: absolute; left: 120px; top: 96px; width: 300px; height: 67px; object-fit: contain; }
.heading { position: absolute; left: 120px; top: 300px; width: 1000px; z-index: 3; }
.small { margin: 0 0 22px; font-size: 50px; line-height: 1.4; font-weight: 700; letter-spacing: .04em; color: var(--accent-600); }
h1 { margin: 0; font-size: 116px; line-height: 1.2; font-weight: 900; letter-spacing: .035em; color: var(--ink); white-space: pre-line; }
em.hl { font-style: normal; background: linear-gradient(transparent 60%, color-mix(in srgb, var(--hl) 45%, transparent) 60%); padding: 0 .04em; }
.store-badge { position: absolute; left: 120px; top: 760px; height: 96px; width: auto; }
.phones { position: absolute; right: 80px; bottom: 0; width: 860px; height: auto; z-index: 2; filter: drop-shadow(11px 27px 42px var(--phone-shadow)); }
.mascot { position: absolute; z-index: 4; height: auto; }
.mascot-shadow { position: absolute; z-index: 3; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(48, 65, 91, 0.16), rgba(48, 65, 91, 0) 70%); }
.shape { position: absolute; z-index: 0; width: var(--size); height: var(--size); border-radius: 28%; background: var(--shape-color); opacity: calc(var(--alpha) * var(--shape-alpha-k)); }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <img class="wordmark" src="../../apps/lp/site/img/wordmark-navy.png" alt="Atender">
  <div class="heading">
    <p class="small" id="small"></p>
    <h1 id="title"></h1>
  </div>
  <img class="store-badge" src="../../apps/lp/site/img/app-store-badge-ja.svg" alt="App Store からダウンロード">
  <img class="phones" id="phones" alt="">
  <div class="mascot-shadow" id="mascot-shadow" aria-hidden="true"></div>
  <img class="mascot" id="mascot" alt="">
</div>
<script>
// ?variant=hero (既定) | friends。コピーはストア画像 A 案 (.designs/20261029-store-screenshots.md §3-1) の 1 枚目 / 5 枚目。
// マスコットは「端末の肩 (右上) に乗せる」。OG (y 36〜1044 を切り出し) の安全域 y 86〜994 の内側に可視部が収まる位置。
const VARIANTS = {
  hero: {
    small: '出席率、把握してる？',
    large: 'もう[出席率]で\n焦らない',
    hl: '#56D8C3',
    phones: { src: '../../apps/lp/site/img/hero-phones.webp', css: 'right:80px; width:860px' },
    mascot: { src: '../../apps/lp/site/img/mascot-hello.png', left: 1615, top: 365, width: 270, foot: 0.861 },
    shapes: [[1010, 120, 64, .18], [1180, 210, 40, .24], [1700, 130, 96, .12], [1800, 250, 52, .18],
      [70, 930, 72, .14], [560, 900, 48, .22], [880, 980, 88, .10], [1500, 60, 44, .20]]
  },
  friends: {
    small: '次の空きコマ、誰いる？',
    large: '友達の[時間割]を\n重ねて見る',
    hl: '#FD728E',
    phones: { src: '../../apps/lp/site/img/phone-5.webp', css: 'right:210px; width:460px' },
    mascot: { src: '../../apps/lp/site/img/mascot-chat.png', left: 1482, top: 61, width: 300, foot: 0.811 },
    shapes: [[1010, 120, 64, .18], [1180, 300, 40, .24], [1760, 560, 96, .12], [1840, 300, 52, .18],
      [70, 930, 72, .14], [560, 900, 48, .22], [880, 980, 88, .10], [1000, 640, 44, .20]]
  }
};
const variant = new URLSearchParams(location.search).get('variant') === 'friends' ? 'friends' : 'hero';
const V = VARIANTS[variant];
const { small: SMALL, large: LARGE, shapes: SHAPES } = V;
const COLORS = ['#56D8C3', '#568CFC', '#8F7EFC', '#A978FA', '#FC6ABF', '#FD728E'];
document.documentElement.style.setProperty('--hl', V.hl);
const phonesImg = document.getElementById('phones');
phonesImg.src = V.phones.src;
phonesImg.style.cssText = V.phones.css;
const mascotImg = document.getElementById('mascot');
mascotImg.src = V.mascot.src;
mascotImg.style.left = V.mascot.left + 'px';
mascotImg.style.top = V.mascot.top + 'px';
mascotImg.style.width = V.mascot.width + 'px';
// 影は CSS で描く (素材の影は除去済み)。足の接地線 (可視部の下端 = top + foot × 幅) を中心に、幅はマスコット幅の 70%、高さは 12%
const shadow = document.getElementById('mascot-shadow');
const sw = V.mascot.width * 0.7, sh = V.mascot.width * 0.12;
shadow.style.width = sw + 'px';
shadow.style.height = sh + 'px';
shadow.style.left = (V.mascot.left + V.mascot.width / 2 - sw / 2) + 'px';
shadow.style.top = (V.mascot.top + V.mascot.foot * V.mascot.width - sh / 2) + 'px';
const canvas = document.getElementById('canvas');
document.getElementById('small').textContent = SMALL;
const title = document.getElementById('title');
LARGE.split(/\[|\]/).forEach((part, i) => {
  if (i % 2) { const em = document.createElement('em'); em.className = 'hl'; em.textContent = part; title.append(em); }
  else title.append(document.createTextNode(part));
});
SHAPES.forEach(([x, y, size, alpha], i) => {
  const s = document.createElement('div');
  s.className = 'shape';
  s.style.left = x + 'px'; s.style.top = y + 'px';
  s.style.setProperty('--size', size + 'px');
  s.style.setProperty('--alpha', alpha);
  s.style.setProperty('--shape-color', COLORS[i % 6]);
  s.setAttribute('aria-hidden', 'true');
  canvas.append(s);
});
// フォントと全画像の読み込み結果を確認してから撮影可能にする (mocks/store/index.html と同じ作法)。
(async () => {
  let loaded1 = [], loaded2 = [];
  try {
    [loaded1, loaded2] = await Promise.all([
      document.fonts.load('900 116px "Zen Maru Gothic"', LARGE.replace(/[\[\]\n]/g, '')),
      document.fonts.load('700 50px "Zen Maru Gothic"', SMALL)
    ]);
  } catch (error) { console.warn('フォントの読み込み失敗:', error); }
  await document.fonts.ready;
  document.documentElement.dataset.fontLoaded = String(loaded1.length > 0 && loaded2.length > 0);
  const missing = await Promise.all(Array.from(document.images, async img => {
    try { await img.decode(); return null; }
    catch { return img.getAttribute('src'); }
  }));
  document.documentElement.dataset.missing = JSON.stringify(missing.filter(src => src !== null));
  document.documentElement.dataset.ready = 'true';
})();
</script>
</body>
</html>
